name: 'Publish major version'

on:
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  actions-tagger:
    runs-on: pr-1cpu2gb-runner-set
    permissions:
      contents: write
    steps:
      # Replaces Actions-R-Us/actions-tagger: point the major tag (e.g. `v5`) at
      # this release when it is the highest non-prerelease version of that major.
      - name: Update major version tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "Pre-release $TAG, not moving the major tag."
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not vMAJOR.MINOR.PATCH, nothing to do."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          highest=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/$major." --jq '.[].ref' \
            | sed 's#^refs/tags/##' | grep -E "^${major}\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)
          if [ "$highest" != "$TAG" ]; then
            echo "$TAG is not the latest $major release ($highest), not moving $major."
            exit 0
          fi
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if gh api "repos/$REPO/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null
          fi
          echo "Moved $major to $TAG ($sha)."
