name: "Lint PR title preview (current branch, outputErrorMessage)"
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: yarn install
      - run: yarn build
      - uses: ./
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Sticky comment via `gh` (replaces marocchino/sticky-pull-request-comment).
      # Uses the same hidden marker so comments created by the old action are reused.
      # When the previous steps fails, the workflow would stop. By adding this
      # condition you can continue the execution with the populated error message.
      - if: always() && (steps.lint_pr_title.outputs.error_message != null)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ERROR_MESSAGE: ${{ steps.lint_pr_title.outputs.error_message }}
        run: |
          set -euo pipefail
          marker='<!-- Sticky Pull Request Commentpr-title-lint-error -->'
          body_file="$RUNNER_TEMP/pr-title-lint-error.md"
          cat > "$body_file" <<'EOF'
          Hey there and thank you for opening this pull request! 👋🏼

          We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

          Details:

          ```
          EOF
          printf '%s\n```\n\n%s\n' "$ERROR_MESSAGE" "$marker" >> "$body_file"
          comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg m "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($m))) | .id' \
            | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@"$body_file" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$body_file" > /dev/null
          fi
      # Delete a previous comment when the issue has been resolved
      - if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- Sticky Pull Request Commentpr-title-lint-error -->'
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg m "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($m))) | .id' \
            | while read -r comment_id; do
                gh api -X DELETE "repos/$REPO/issues/comments/$comment_id"
              done
